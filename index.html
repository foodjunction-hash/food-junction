<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The King Is Back</title>
    
    <!-- Importing Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #030201; /* Very dark black */
            /* 2nd Image wala Background Glow + Golden Dust */
            background-image: 
                radial-gradient(circle at 90% 30%, rgba(139, 69, 19, 0.4) 0%, transparent 40%), /* Right side golden glow */
                radial-gradient(circle at 20% 80%, rgba(139, 69, 19, 0.1) 0%, transparent 30%), /* Bottom left subtle glow */
                radial-gradient(circle at 50% 50%, #110a04 0%, #000000 80%);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Smooth Moving Stars/Sparkles (Jo background me chamakte hain) */
        .sparkles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* Generating random dots using radial gradients */
            background-image: 
                radial-gradient(1.5px 1.5px at 10% 20%, #d4af37, transparent),
                radial-gradient(1px 1px at 25% 15%, #d4af37, transparent),
                radial-gradient(2px 2px at 40% 30%, #ffcc00, transparent),
                radial-gradient(1px 1px at 60% 10%, #d4af37, transparent),
                radial-gradient(1.5px 1.5px at 80% 25%, #d4af37, transparent),
                radial-gradient(1px 1px at 95% 50%, #ffcc00, transparent),
                radial-gradient(1px 1px at 15% 65%, #d4af37, transparent),
                radial-gradient(1.5px 1.5px at 35% 85%, #d4af37, transparent),
                radial-gradient(1px 1px at 70% 75%, #ffcc00, transparent),
                radial-gradient(2px 2px at 88% 90%, #d4af37, transparent);
            background-size: 100% 100%;
            opacity: 0.7;
            animation: twinkleAndMove 8s ease-in-out infinite alternate;
        }

        @keyframes twinkleAndMove {
            0% { transform: translateY(0px); opacity: 0.4; }
            100% { transform: translateY(-10px); opacity: 0.9; }
        }

        /* Main Container to keep content above background */
        .content-wrapper {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Top Small Text */
        .top-text {
            font-size: 11px;
            letter-spacing: 8px; 
            color: #d4af37;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Crown Emoji */
        .crown {
            font-size: 55px;
            margin-bottom: 15px;
            /* Glowing crown */
            filter: drop-shadow(0 0 15px rgba(255, 165, 0, 0.8)) drop-shadow(0 0 30px rgba(255, 100, 0, 0.4));
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* WAIT... I AM BACK! */
        .sub-head {
            font-size: 16px;
            letter-spacing: 7px;
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 500;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        /* Main Title - THE KING IS BACK */
        .main-title {
            font-family: 'Cinzel', serif;
            font-size: 95px;
            line-height: 0.95;
            
            /* Text Color Gradient (Top Light -> Bottom Dark Gold) */
            background: linear-gradient(to bottom, #fff5cc 10%, #f3c04b 50%, #b87e1b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* STRONG GLOW (Exactly like the image) */
            text-shadow: 
                0px 0px 20px rgba(255, 180, 50, 0.6),
                0px 0px 50px rgba(255, 140, 0, 0.4),
                0px 0px 80px rgba(139, 69, 19, 0.3);
            
            margin-bottom: 30px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* Divider Line with Glow */
        .divider {
            width: 350px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #d4af37, #fff5cc, #d4af37, transparent);
            margin: 0 auto 35px auto;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.8);
            border-radius: 50%;
        }

        /* Legends Never Quit */
        .quote {
            font-family: 'Cinzel', serif;
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        /* KINGS ALWAYS RETURN! */
        .highlight {
            font-family: 'Cinzel', serif;
            color: #d4af37;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* The Button Box */
        .status-box {
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 15px 45px;
            border-radius: 50px;
            color: #d4af37;
            font-size: 12px;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: rgba(10, 5, 0, 0.5);
            box-shadow: 
                inset 0 0 20px rgba(212, 175, 55, 0.1),
                0 0 20px rgba(212, 175, 55, 0.2);
            margin-bottom: 40px;
            display: inline-block;
            font-weight: 600;
        }

        /* Icons */
        .icons {
            font-size: 24px;
            display: flex;
            gap: 30px;
            justify-content: center;
            filter: drop-shadow(0 0 10px rgba(255, 80, 0, 0.6));
        }

        /* Footer */
        .footer {
            position: absolute;
            bottom: 25px;
            font-size: 10px;
            letter-spacing: 6px;
            color: #666;
            text-transform: uppercase;
            font-weight: 600;
            z-index: 2;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .main-title { font-size: 55px; }
            .sub-head { font-size: 12px; letter-spacing: 4px; }
            .top-text { letter-spacing: 5px; font-size: 9px;}
            .quote { font-size: 18px; }
            .highlight { font-size: 16px; }
            .crown { font-size: 40px; }
            .divider { width: 250px; }
            .status-box { padding: 12px 25px; font-size: 9px; letter-spacing: 3px; }
            body { background-image: radial-gradient(circle at 50% 50%, #1a0f00 0%, #000 100%); }
        }
    </style>
</head>
<body>

    <!-- Background Stars & Glow effect -->
    <div class="sparkles"></div>

    <!-- Main Content -->
    <div class="content-wrapper">
        <div class="top-text">✦ THE ROYAL RETURN ✦</div>
        
        <div class="crown">👑</div>
        
        <div class="sub-head">WAIT... I AM BACK!</div>
        
        <h1 class="main-title">THE KING<br>IS BACK!</h1>
        
        <div class="divider"></div>
        
        <div class="quote">Legends Never Quit,</div>
        <div class="highlight">KINGS ALWAYS RETURN! 🦁 🔥</div>
        
        <div class="status-box">NO FEAR · NO LIMITS · ONLY KING</div>

        <div class="icons">
            <span>🔥</span>
            <span>💀</span>
            <span>🔥</span>
        </div>
    </div>

    <div class="footer">THE LEGEND NEVER DIES</div>

</body>
</html>
