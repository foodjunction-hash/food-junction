<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Food Junction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0B0B0F;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container { max-width: 400px; }
    .icon { font-size: 80px; margin-bottom: 20px; }
    h1 { font-size: 28px; margin-bottom: 10px; color: #F5B301; }
    p { color: rgba(255,255,255,0.6); margin-bottom: 30px; line-height: 1.6; }
    button {
      background: #F5B301;
      color: #0B0B0F;
      border: none;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 999px;
      cursor: pointer;
    }
    button:hover { background: #FFD54F; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>Internet connection nahi hai. Please check karo aur dobara try karo.</p>
    <button onclick="window.location.reload()">Retry</button>
  </div>
</body>
</html>
